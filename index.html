<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nacht der Bestien</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>🎮 Nacht der Bestien</h1>
      <p class="subtitle">Überlebe 50 Level in einer Welt voller Monster.</p>
    </header>

    <section id="start-screen" class="panel">
      <h2>Wähle deinen Charakter</h2>
      <div class="characters">
        <button class="character-card" data-character="youth">
          <h3>🎧 Jugendlicher</h3>
          <p>Schnell, erkennt Geräusche, entwickelt Spezialfähigkeiten.</p>
        </button>
        <button class="character-card" data-character="puma">
          <h3>🐆 Puma mit Helm</h3>
          <p>Beweglich, springt und klettert, später mit Spezialrüstung.</p>
        </button>
        <button class="character-card" data-character="werewolf">
          <h3>🐺 Werwolf</h3>
          <p>Startet schwächer, wird pro Gebiet stärker, kann später Lebensraub.</p>
        </button>
      </div>
      <button id="start-game" disabled>Spiel starten</button>
    </section>

    <section id="game-screen" class="panel hidden">
      <div class="hud">
        <span id="hud-character"></span>
        <span id="hud-level"></span>
        <span id="hud-area"></span>
        <span id="hud-hp"></span>
      </div>
      <div class="enemy-box">
        <h2 id="enemy-name"></h2>
        <p id="enemy-desc"></p>
        <p id="enemy-stats"></p>
      </div>
      <div class="actions">
        <button id="attack-btn">Angreifen</button>
        <button id="skill-btn">Fähigkeit einsetzen</button>
        <button id="heal-btn">Fokus sammeln</button>
      </div>
      <div id="log" class="log"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
